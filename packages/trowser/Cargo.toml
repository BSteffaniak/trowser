[package]
authors     = { workspace = true }
categories  = ["command-line-utilities", "web-programming"]
description = "Facade crate for trowser"
edition     = { workspace = true }
keywords    = ["browser", "terminal", "trowser"]
license     = { workspace = true }
name        = "trowser"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
trowser_browser        = { workspace = true, optional = true }
trowser_browser_cdp    = { workspace = true, optional = true }
trowser_cli            = { workspace = true, optional = true }
trowser_client         = { workspace = true, optional = true }
trowser_config         = { workspace = true, optional = true }
trowser_ipc            = { workspace = true, optional = true }
trowser_render         = { workspace = true, optional = true }
trowser_server         = { workspace = true, optional = true }
trowser_session_models = { workspace = true, optional = true }
trowser_terminal       = { workspace = true, optional = true }
trowser_terminal_image = { workspace = true, optional = true }

[features]
all = [
    "browser",
    "browser-cdp",
    "cli",
    "client",
    "config",
    "ipc",
    "render",
    "server",
    "session-models",
    "terminal",
    "terminal-image",
]
browser = ["dep:trowser_browser"]
browser-cdp = ["browser", "dep:trowser_browser_cdp"]
cli = ["dep:trowser_cli"]
client = ["config", "dep:trowser_client", "ipc"]
config = ["dep:trowser_config"]
default = []
fail-on-warnings = [
    "trowser_browser?/fail-on-warnings",
    "trowser_browser_cdp?/fail-on-warnings",
    "trowser_cli?/fail-on-warnings",
    "trowser_client?/fail-on-warnings",
    "trowser_config?/fail-on-warnings",
    "trowser_ipc?/fail-on-warnings",
    "trowser_render?/fail-on-warnings",
    "trowser_server?/fail-on-warnings",
    "trowser_session_models?/fail-on-warnings",
    "trowser_terminal?/fail-on-warnings",
    "trowser_terminal_image?/fail-on-warnings",
]
ipc = ["dep:trowser_ipc", "render", "session-models"]
render = ["dep:trowser_render"]
server = ["config", "dep:trowser_server", "ipc"]
session-models = ["dep:trowser_session_models"]
terminal = ["dep:trowser_terminal", "render", "terminal-image"]
terminal-image = ["dep:trowser_terminal_image"]
