[package]
authors     = { workspace = true }
categories  = ["command-line-utilities", "rendering"]
description = "Terminal rendering primitives for trowser"
edition     = { workspace = true }
keywords    = ["terminal", "trowser", "tui"]
license     = { workspace = true }
name        = "trowser_terminal"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_keyboard = { workspace = true }
bmux_text_edit = { workspace = true }
bmux_tui = { workspace = true }
bmux_tui_components = { workspace = true, features = [
    "dialog",
    "key-hint-bar",
    "scrollbar",
    "spinner",
    "status-bar",
    "tab-bar",
    "text-input-box",
] }
bmux_tui_runtime = { workspace = true }
tokio = { workspace = true, features = ["time"] }
trowser_render = { workspace = true }
trowser_session_models = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = []
fail-on-warnings = [
    "bmux_keyboard/fail-on-warnings",
    "bmux_text_edit/fail-on-warnings",
    "bmux_tui/fail-on-warnings",
    "bmux_tui_components/fail-on-warnings",
    "bmux_tui_runtime/fail-on-warnings",
    "trowser_render/fail-on-warnings",
    "trowser_session_models/fail-on-warnings",
]
